# Render Blueprint (must live at repo ROOT). Deploys the StockDotFun V2 indexer
# from the indexer/ subfolder (rootDir below).
#
# Render → New + → Blueprint → connect this repo. It reads this file.
# Then set DATABASE_URL in the dashboard = your Supabase connection string
# (session pooler port 5432 recommended; direct 5432 also works on Render).
services:
  - type: web
    name: stockdotfun-indexer
    runtime: node
    rootDir: indexer
    plan: starter # always-on, ~$7/mo (0.5 CPU). REQUIRED to keep pace with
    # Robinhood Chain: the free plan (0.1 CPU) only processes ~3.7 blocks/sec
    # while the chain produces ~10.4/sec, so it falls behind forever. Starter
    # (~18 blocks/sec) catches up and holds realtime sync. Needs a payment
    # method on the Render account or the deploy will fail with "Payment
    # Information Required".
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run start
    # Use /health (liveness — 200 as soon as the server binds), NOT /ready.
    # Ponder's /ready returns 503 until historical indexing is complete, and the
    # HTTP server only starts AFTER the DB schema lock is acquired. On a paid
    # (zero-downtime) plan the old instance holds the lock, so /ready-gated
    # deploys can never go healthy. /health lets the new instance report healthy
    # immediately and finish indexing in the background.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # set in dashboard: Supabase connection string
      - key: PONDER_RPC_URL_4663
        sync: false # optional; else defaults to public RHC RPC
      - key: DATABASE_SCHEMA
        # Bumped v2 -> v3 to migrate onto the Starter plan: a fresh schema lets
        # the new instance boot without colliding with the old instance's lock
        # on 'stockdotfun_v2' (two Ponder apps can't share one schema). Ponder's
        # raw-data sync store is shared, so re-indexing into v3 is fast.
        # NOTE: must match the --schema in indexer/package.json's start script.
        value: "stockdotfun_v3" # Ponder writes its tables into this Postgres schema
      - key: FACTORY_ADDRESS
        value: "0x470aca74d71269833de8cf65640dfb558393569e"
      - key: TREASURY_ADDRESS
        value: "0x284c47ef1754fa82b85cbe8207dd749e6f9ca389"
      - key: CREATOR_VAULT_ADDRESS
        value: "0x343151434ef2f86d0ff96af0b68e7986b1c33b6c"
      - key: FACTORY_START_BLOCK
        value: "7364760"
      - key: GRADUATION_TARGET_WEI
        value: "4400000000000000000"
