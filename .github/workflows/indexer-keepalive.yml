name: stockdotfun-indexer-keepalive

# Keeps the Render-hosted Ponder indexer awake. The FREE Render plan sleeps a
# web service after ~15 min with no inbound HTTP; while asleep it makes no
# indexing progress and falls behind the chain head, so Explore / token pages
# show stale or missing trades. This workflow pings the indexer on a short
# interval so it stays awake, catches up to head, and maintains realtime sync.
#
# This is a best-effort free stopgap — GitHub's scheduler can delay cron runs
# under load, so it does not GUARANTEE the service never sleeps. For a reliable
# always-on indexer, upgrade the Render service to a paid plan (render.yaml:
# `plan: starter`). No secrets required.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {} # allow manual runs

concurrency:
  group: indexer-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INDEXER_URL: ${{ vars.INDEXER_URL || 'https://stockdotfun-indexer.onrender.com' }}
    steps:
      - name: Ping indexer (several times to bridge scheduler jitter)
        run: |
          set -u
          for i in 1 2 3 4; do
            code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" "$INDEXER_URL/tokens" || echo "000")
            block=$(curl -s -m 60 "$INDEXER_URL/status" || echo "unavailable")
            echo "ping $i -> HTTP $code | status: $block"
            [ "$i" -lt 4 ] && sleep 90
          done
          echo "Keep-alive complete. If HTTP was 000, the service may be cold-starting."
