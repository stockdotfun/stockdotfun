name: stockdotfun-indexer-watchdog

# Self-healing watchdog for the Render-hosted Ponder indexer.
#
# Robinhood Chain produces ~10 blocks/sec, but Ponder's realtime sync tops out
# ~6 blocks/sec on the PUBLIC RPC, so the indexer slowly drifts behind the head
# and newly-created tokens / trades surface late. A fresh deploy re-syncs via
# fast batched backfill and snaps back to the head. This job checks the lag on a
# schedule and, only if it has drifted past the threshold, triggers a Render
# re-sync via a Deploy Hook. When the indexer is healthy it does nothing.
#
# PERMANENT FIX (makes this watchdog effectively never fire): point the indexer
# at a dedicated low-latency RPC by setting PONDER_RPC_URL_4663 in the Render
# dashboard (Alchemy / QuickNode both support Robinhood Chain mainnet, HTTP+WSS).
#
# ACTIVATION: add repo secret RENDER_DEPLOY_HOOK_URL
#   (Render -> stockdotfun-indexer -> Settings -> Deploy Hook -> copy URL).
# Optional repo variables: LAG_THRESHOLD (default 6000 blocks), INDEXER_URL,
# RHC_RPC_URL. Without the secret, the job only reports lag and takes no action.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min (GitHub may delay under load)
  workflow_dispatch: {} # allow manual runs

concurrency:
  group: indexer-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INDEXER_URL: ${{ vars.INDEXER_URL || 'https://stockdotfun-indexer.onrender.com' }}
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      # STUCK-detector, not lag-vs-head: Ponder's /status reports the FINALIZED
      # block, and Robinhood Chain's finality trails the head by ~200k blocks, so
      # "lag vs head" always looks huge and would redeploy every run. Instead we
      # check whether the indexer's block ADVANCES over ~90s. A healthy indexer
      # moves; a hung one doesn't → then (and only then) re-sync.
      - name: Re-sync only if the indexer is stuck (not advancing)
        run: |
          set -u
          getblk() {
            curl -s -m 30 "$INDEXER_URL/status" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['robinhood']['block']['number'])" 2>/dev/null || echo ""
          }
          b1=$(getblk)
          if [ -z "$b1" ]; then echo "Indexer /status unreachable; skipping."; exit 0; fi
          sleep 90
          b2=$(getblk)
          if [ -z "$b2" ]; then echo "Indexer /status unreachable on second read; skipping."; exit 0; fi
          echo "indexer block: $b1 -> $b2 over 90s (advanced $((b2 - b1)))"
          if [ "$b2" -gt "$b1" ]; then
            echo "Indexer is advancing — healthy, no action."
            exit 0
          fi
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Indexer is stuck at block $b1 but RENDER_DEPLOY_HOOK_URL is not set — cannot auto re-sync."
            exit 0
          fi
          echo "Indexer stuck at block $b1 (no advance in 90s). Triggering a Render re-sync..."
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          echo "Deploy hook responded HTTP $code."
