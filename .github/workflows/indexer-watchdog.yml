name: stockdotfun-indexer-watchdog

# Self-healing watchdog for the Render-hosted Ponder indexer.
#
# Robinhood Chain produces ~10 blocks/sec, but Ponder's realtime sync tops out
# ~6 blocks/sec on the PUBLIC RPC, so the indexer slowly drifts behind the head
# and newly-created tokens / trades surface late. A fresh deploy re-syncs via
# fast batched backfill and snaps back to the head. This job checks the lag on a
# schedule and, only if it has drifted past the threshold, triggers a Render
# re-sync via a Deploy Hook. When the indexer is healthy it does nothing.
#
# PERMANENT FIX (makes this watchdog effectively never fire): point the indexer
# at a dedicated low-latency RPC by setting PONDER_RPC_URL_4663 in the Render
# dashboard (Alchemy / QuickNode both support Robinhood Chain mainnet, HTTP+WSS).
#
# ACTIVATION: add repo secret RENDER_DEPLOY_HOOK_URL
#   (Render -> stockdotfun-indexer -> Settings -> Deploy Hook -> copy URL).
# Optional repo variables: LAG_THRESHOLD (default 6000 blocks), INDEXER_URL,
# RHC_RPC_URL. Without the secret, the job only reports lag and takes no action.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min (GitHub may delay under load)
  workflow_dispatch: {} # allow manual runs

concurrency:
  group: indexer-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INDEXER_URL: ${{ vars.INDEXER_URL || 'https://stockdotfun-indexer.onrender.com' }}
      RPC_URL: ${{ vars.RHC_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      FACTORY: ${{ vars.FACTORY_ADDRESS || '0x470aca74d71269833de8cf65640dfb558393569e' }}
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      # Re-sync when the indexer has fallen behind the chain — measured by the
      # user-facing symptom, not a block number (Ponder's /status reports the
      # FINALIZED block, which trails the head by ~200k on Robinhood Chain, so a
      # raw "lag vs head" is meaningless). Two robust signals:
      #   1) on-chain token count > indexed token count (a launch isn't showing)
      #   2) indexer block frozen over ~60s (genuinely hung)
      # A confirm re-check avoids re-syncing on a token that's just seconds old.
      - name: Re-sync if indexed tokens fall behind on-chain, or if stuck
        run: |
          set -u
          onchain_tokens() {
            hex=$(curl -s -m 30 -X POST "$RPC_URL" -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_call\",\"params\":[{\"to\":\"$FACTORY\",\"data\":\"0xdbb80e42\"},\"latest\"]}" \
              | python3 -c "import sys,json;print(int(json.load(sys.stdin)['result'],16))" 2>/dev/null || echo "")
            echo "$hex"
          }
          indexed_tokens() { curl -s -m 30 "$INDEXER_URL/tokens" | python3 -c "import sys,json;print(len(json.load(sys.stdin)))" 2>/dev/null || echo ""; }
          getblk() { curl -s -m 30 "$INDEXER_URL/status" | python3 -c "import sys,json;print(json.load(sys.stdin)['robinhood']['block']['number'])" 2>/dev/null || echo ""; }

          oc=$(onchain_tokens); ix=$(indexed_tokens); b1=$(getblk)
          echo "on-chain tokens=$oc | indexed=$ix | indexer block=$b1"
          if [ -z "$oc" ] || [ -z "$ix" ] || [ -z "$b1" ]; then echo "A read failed; skipping this run."; exit 0; fi

          behind=0; stuck=0
          [ "$oc" -gt "$ix" ] && behind=1
          if [ "$behind" -eq 0 ]; then
            sleep 60; b2=$(getblk)
            if [ -n "$b2" ] && [ "$b2" -le "$b1" ]; then stuck=1; echo "indexer block frozen ($b1 -> $b2 in 60s)"; fi
          else
            # confirm the token gap persists (not a brand-new launch mid-index)
            sleep 45; ix2=$(indexed_tokens)
            [ -n "$ix2" ] && [ "$oc" -gt "$ix2" ] && behind=1 || behind=0
          fi

          if [ "$behind" -eq 0 ] && [ "$stuck" -eq 0 ]; then
            echo "Indexer healthy (data current, block advancing) — no action."
            exit 0
          fi
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Indexer needs a re-sync (behind=$behind stuck=$stuck) but RENDER_DEPLOY_HOOK_URL is not set."
            exit 0
          fi
          echo "Re-syncing indexer (behind=$behind stuck=$stuck)..."
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          echo "Deploy hook responded HTTP $code."
