# One-click Render deploy for the StockDotFun V2 indexer.
# Render dashboard → New → Blueprint → point at this repo (root dir: indexer).
# Then set the two secret env vars marked `sync: false` in the dashboard:
#   DATABASE_URL          (Supabase DIRECT connection, port 5432 — NOT 6543)
#   PONDER_RPC_URL_4663   (optional; defaults to the public RPC)
services:
  - type: web
    name: stockdotfun-indexer
    runtime: node
    rootDir: indexer
    plan: starter
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # set in dashboard: Supabase direct connection (5432)
      - key: PONDER_RPC_URL_4663
        sync: false # optional; else defaults to public RHC RPC
      - key: FACTORY_ADDRESS
        value: "0x470aca74d71269833de8cf65640dfb558393569e"
      - key: TREASURY_ADDRESS
        value: "0x284c47ef1754fa82b85cbe8207dd749e6f9ca389"
      - key: CREATOR_VAULT_ADDRESS
        value: "0x343151434ef2f86d0ff96af0b68e7986b1c33b6c"
      - key: FACTORY_START_BLOCK
        value: "7364760"
      - key: GRADUATION_TARGET_WEI
        value: "4400000000000000000"
